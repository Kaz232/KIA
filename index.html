<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GAG Visual Core OS</title>
    <meta name="description" content="GAG Core OS — Sistema Operacional de IA Multi-Agente para a GAG Visual com KIA Master Orchestrator, Integração 24/7 WhatsApp Business API, Estúdio Multimodal e Sinergia Operacional." />
    <meta name="theme-color" content="#05070c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GAG Visual Core OS" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta property="og:title" content="GAG Visual Core OS" />
    <meta property="og:description" content="GAG Core OS — Sistema Operacional de IA Multi-Agente para a GAG Visual com KIA Master Orchestrator, Integração 24/7 WhatsApp Business API, Estúdio Multimodal e Sinergia Operacional." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Automatically unregister stale service workers in development and preview environments to avoid blank screen cache issues
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        }).catch(function() {});
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            if (names[i].indexOf('gag-core') !== -1) {
              caches.delete(names[i]);
            }
          }
        }).catch(function() {});
      }
      // Global error handler to prevent silent white/blank screen
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          console.error('[GAG Core UI Error]', e);
          root.innerHTML = '<div style="min-height:100vh;background:#05070c;color:#f8fafc;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;"><div style="max-width:480px;background:#090d16;border:1px solid rgba(245,158,11,0.4);border-radius:16px;padding:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);text-align:center;"><div style="width:48px;height:48px;background:rgba(245,158,11,0.2);border-radius:12px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:24px;">⚡</div><h2 style="font-size:18px;font-weight:800;color:#fff;margin-bottom:8px;">GAG Visual Core OS</h2><p style="font-size:14px;color:#94a3b8;margin-bottom:16px;">O sistema está a reinicializar o ambiente de visualização.</p><button onclick="window.location.reload(true)" style="background:#f59e0b;color:#000;font-weight:700;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;">Recarregar Aplicação</button></div></div>';
        }
      });
    </script>
  </head>
  <body class="bg-[#05070c] text-slate-100" style="background-color: #05070c; margin: 0; min-height: 100vh; color: #f8fafc;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
